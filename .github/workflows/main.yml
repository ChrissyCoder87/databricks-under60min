name: Complete Infrastructure Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0 

      # 3️⃣ Debug: Verzeichnis prüfen
      - name: List directory
        run: |
          pwd
          ls -R

      # 4️⃣ Terraform Init
      - name: Terraform Init
        run: terraform -chdir=infrastructure/environments/dev init

      # 5️⃣ Terraform Plan (optional)
      - name: Terraform Plan
        run: terraform -chdir=infrastructure/environments/dev plan
