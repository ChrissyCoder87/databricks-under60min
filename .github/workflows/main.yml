name: Complete Infrastructure Deployment

on:
  push:
    branches: [main]   # Workflow startet bei Push auf main
  pull_request:
    branches: [main]   # Workflow startet bei PR auf main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Debug: Verzeichnisstruktur prüfen
      - name: List directory
        run: |
          echo "Current directory:"
          pwd
          echo "List all files recursively:"
          ls -R

      # 3️⃣ Terraform init
      - name: Terraform Init
        run: terraform -chdir=infrastructure/environments/dev init

      # 4️⃣ Optional: Terraform plan (nur zur Kontrolle)
      - name: Terraform Plan
        run: terraform -chdir=infrastructure/environments/dev plan
